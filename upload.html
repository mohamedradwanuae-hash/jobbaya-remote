<!-- Login -->
<div id="login-section" class="hidden max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border mt-10">
    <h1 class="text-2xl font-bold mb-6 text-center">
        🔐 Admin Login
    </h1>

    <form id="login-form" class="space-y-4">
        <input
            type="email"
            id="login-email"
            placeholder="Email address"
            required
            class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
        >

        <input
            type="password"
            id="login-password"
            placeholder="Password"
            required
            class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
        >

        <button
            type="submit"
            class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition"
        >
            Login
        </button>

        <p id="login-error" class="text-red-500 text-sm text-center hidden">
            Invalid email or password.
        </p>
    </form>
</div>
