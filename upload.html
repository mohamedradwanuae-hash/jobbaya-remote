<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Job | Jobbaya Remote</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-emerald-600">
                🏠 Jobbaya Remote
            </a>

            <div class="space-x-4 text-sm">
                <a href="index.html" class="hover:text-emerald-600">Jobs</a>
                <button id="logout-button" class="hidden text-red-500 hover:text-red-700 font-semibold">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">

        <!-- Loading -->
        <div id="loading-section" class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border text-center">
            <p class="text-gray-500">Checking access...</p>
        </div>

        <!-- Login -->
        <div id="login-section" class="hidden max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border mt-10">
            <h1 class="text-2xl font-bold mb-6 text-center">
                🔐 Admin Login
            </h1>

            <form id="login-form" class="space-y-4">
                <input
                    type="email"
                    id="email"
                    placeholder="Admin email"
                    required
                    class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                    class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                >

                <button
                    type="submit"
                    class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition"
                >
                    Login
                </button>

                <p id="login-error" class="text-red-500 text-sm text-center hidden">
                    Invalid email or password.
                </p>
            </form>
        </div>

        <!-- Upload dashboard -->
        <div id="upload-section" class="hidden">

            <div class="grid gap-8 lg:grid-cols-2">

                <!-- Upload form -->
                <div class="bg-white p-8 rounded-xl shadow-sm border">
                    <h1 class="text-3xl font-bold mb-6">
                        ➕ Upload New Job
                    </h1>

                    <form id="upload-form" class="space-y-5">

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Job Picture
                            </label>

                            <input
                                type="file"
                                id="image"
                                accept="image/*"
                                class="w-full p-3 border rounded-lg bg-white"
                            >

                            <img
                                id="image-preview"
                                class="mt-4 w-40 h-40 object-cover rounded-lg border hidden"
                                alt="Image preview"
                            >

                            <p class="text-xs text-gray-400 mt-2">
                                Recommended: landscape image, JPG/PNG, max 3 MB.
                            </p>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Job Title *
                            </label>

                            <input
                                type="text"
                                id="title"
                                placeholder="e.g. Remote Customer Support Agent"
                                required
                                class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Salary
                            </label>

                            <input
                                type="text"
                                id="salary"
                                placeholder="e.g. 20,000 - 35,000 EGP/month"
                                class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Job Description *
                            </label>

                            <textarea
                                id="description"
                                rows="8"
                                placeholder="Write the full job details here..."
                                required
                                class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                            ></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Application Link *
                            </label>

                            <input
                                type="url"
                                id="apply-link"
                                placeholder="https://..."
                                required
                                class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                            >
                        </div>

                        <button
                            type="submit"
                            id="submit-button"
                            class="w-full bg-emerald-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-emerald-700 transition"
                        >
                            Submit Job
                        </button>

                        <p id="form-message" class="text-sm text-center hidden"></p>
                    </form>
                </div>

                <!-- Published jobs -->
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                    <div class="p-6 border-b">
                        <h2 class="text-2xl font-bold">
                            📋 Published Jobs
                        </h2>
                    </div>

                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-4 font-semibold">Title</th>
                                <th class="p-4 font-semibold">Date</th>
                                <th class="p-4 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>

                        <tbody id="admin-jobs-table">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-gray-400">
                                    Loading jobs...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </div>

    </main>

    <footer class="border-t bg-white mt-auto">
        <div class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-gray-400">
            <p>&copy; 2026 Jobbaya Remote. All rights reserved.</p>
        </div>
    </footer>

    <script src="config.js"></script>

    <script>
        const loadingSection = document.getElementById("loading-section");
        const loginSection = document.getElementById("login-section");
        const uploadSection = document.getElementById("upload-section");
        const logoutButton = document.getElementById("logout-button");

        const loginForm = document.getElementById("login-form");
        const loginError = document.getElementById("login-error");

        const uploadForm = document.getElementById("upload-form");
        const imageInput = document.getElementById("image");
        const imagePreview = document.getElementById("image-preview");
        const submitButton = document.getElementById("submit-button");
        const formMessage = document.getElementById("form-message");

        const adminJobsTable = document.getElementById("admin-jobs-table");

        function showLoading() {
            loadingSection.classList.remove("hidden");
            loginSection.classList.add("hidden");
            uploadSection.classList.add("hidden");
            logoutButton.classList.add("hidden");
        }

        function showLogin() {
            loadingSection.classList.add("hidden");
            loginSection.classList.remove("hidden");
            uploadSection.classList.add("hidden");
            logoutButton.classList.add("hidden");
        }

        function showUploadDashboard() {
            loadingSection.classList.add("hidden");
            loginSection.classList.add("hidden");
            uploadSection.classList.remove("hidden");
            logoutButton.classList.remove("hidden");
            loadAdminJobs();
        }

        function showFormMessage(message, isError = false) {
            formMessage.textContent = message;
            formMessage.classList.remove("hidden");

            if (isError) {
                formMessage.className = "text-sm text-center text-red-500";
            } else {
                formMessage.className = "text-sm text-center text-green-600";
            }
        }

        async function checkAuth() {
            showLoading();

            const { data: { session } } = await supabase.auth.getSession();

            if (session) {
                showUploadDashboard();
            } else {
                showLogin();
            }
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const { error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                loginError.classList.remove("hidden");
                return;
            }

            loginError.classList.add("hidden");
            showUploadDashboard();
        });

        logoutButton.addEventListener("click", async function () {
            await supabase.auth.signOut();
            showLogin();
        });

        imageInput.addEventListener("change", function () {
            const file = imageInput.files[0];

            if (!file) {
                imagePreview.classList.add("hidden");
                imagePreview.removeAttribute("src");
                return;
            }

            if (!file.type.startsWith("image/")) {
                imagePreview.classList.add("hidden");
                imagePreview.removeAttribute("src");
                showFormMessage("Please choose an image file.", true);
                return;
            }

            if (file.size > 3 * 1024 * 1024) {
                imagePreview.classList.add("hidden");
                imagePreview.removeAttribute("src");
                showFormMessage("Image is too large. Maximum size is 3 MB.", true);
                return;
            }

            imagePreview.src = URL.createObjectURL(file);
            imagePreview.classList.remove("hidden");
        });

        uploadForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = "Publishing...";

            try {
                const title = document.getElementById("title").value.trim();
                const salary = document.getElementById("salary").value.trim();
                const description = document.getElementById("description").value.trim();
                const applyLink = document.getElementById("apply-link").value.trim();

                if (!title || !description || !applyLink) {
                    throw new Error("Please fill all required fields.");
                }

                if (!safeUrl(applyLink)) {
                    throw new Error("Application link must be a valid http or https URL.");
                }

                let imageUrl = null;
                const file = imageInput.files[0];

                if (file) {
                    if (!file.type.startsWith("image/")) {
                        throw new Error("Job picture must be an image file.");
                    }

                    if (file.size > 3 * 1024 * 1024) {
                        throw new Error("Job picture is too large. Maximum size is 3 MB.");
                    }

                    const extension = file.name.split(".").pop() || "jpg";
                    const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${extension}`;

                    const { error: uploadError } = await supabase
                        .storage
                        .from(JOB_IMAGES_BUCKET)
                        .upload(fileName, file, {
                            cacheControl: "3600",
                            upsert: false
                        });

                    if (uploadError) {
                        throw new Error(uploadError.message || "Image upload failed.");
                    }

                    const { data: publicUrlData } = supabase
                        .storage
                        .from(JOB_IMAGES_BUCKET)
                        .getPublicUrl(fileName);

                    imageUrl = publicUrlData.publicUrl;
                }

                const { error: insertError } = await supabase
                    .from("jobs")
                    .insert({
                        title: title,
                        description: description,
                        salary_range: salary || null,
                        image_url: imageUrl,
                        apply_link: applyLink,
                        company: null
                    });

                if (insertError) {
                    throw new Error(insertError.message || "Could not publish job.");
                }

                uploadForm.reset();
                imagePreview.classList.add("hidden");
                imagePreview.removeAttribute("src");

                showFormMessage("Job published successfully!");
                await loadAdminJobs();

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);

            } catch (error) {
                console.error(error);
                showFormMessage(error.message || "Something went wrong.", true);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Submit Job";
            }
        });

        async function loadAdminJobs() {
            const { data, error } = await supabase
                .from("jobs")
                .select("id, title, created_at")
                .order("created_at", { ascending: false });

            if (error) {
                console.error(error);
                adminJobsTable.innerHTML = `
                    <tr>
                        <td colspan="3" class="p-4 text-center text-red-500">
                            Error loading jobs.
                        </td>
                    </tr>
                `;
                return;
            }

            if (!data || data.length === 0) {
                adminJobsTable.innerHTML = `
                    <tr>
                        <td colspan="3" class="p-4 text-center text-gray-400">
                            No jobs published yet.
                        </td>
                    </tr>
                `;
                return;
            }

            adminJobsTable.innerHTML = data.map(job => {
                return `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-4 font-medium">
                            ${escapeHtml(job.title)}
                        </td>

                        <td class="p-4 text-gray-500">
                            ${formatDate(job.created_at)}
                        </td>

                        <td class="p-4 text-right">
                            <button
                                onclick="deleteJob('${job.id}')"
                                class="text-red-500 hover:text-red-700 font-semibold text-xs uppercase tracking-wide"
                            >
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        window.deleteJob = async function (jobId) {
            if (!confirm("Delete this job permanently?")) {
                return;
            }

            const { error } = await supabase
                .from("jobs")
                .delete()
                .eq("id", jobId);

            if (error) {
                alert(error.message || "Could not delete job.");
                return;
            }

            await loadAdminJobs();
        };

        checkAuth();
    </script>

</body>
</html>
