<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jobbaya Remote</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-emerald-600">
                🏠 Jobbaya Remote
            </a>

            <div class="space-x-4 text-sm">
                <a href="index.html" class="hover:text-emerald-600">Jobs</a>
                <a href="signup.html" class="hover:text-emerald-600">Sign up</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-sm border">
            <h1 class="text-3xl font-bold mb-6 text-center">
                🔐 Login
            </h1>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Your password"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <button
                    type="submit"
                    id="login-button"
                    class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition"
                >
                    Login
                </button>

                <p id="login-message" class="text-sm text-center hidden"></p>
            </form>

            <p class="text-sm text-gray-500 text-center mt-6">
                Don't have an account?

                <a href="signup.html" class="text-emerald-600 font-semibold hover:underline">
                    Sign up
                </a>
            </p>
        </div>

    </main>

    <script src="config.js"></script>

    <script>
        const loginForm = document.getElementById("login-form");
        const loginButton = document.getElementById("login-button");
        const loginMessage = document.getElementById("login-message");

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showMessage(message, isError = false) {
            loginMessage.textContent = message;
            loginMessage.classList.remove("hidden");

            if (isError) {
                loginMessage.className = "text-sm text-center text-red-500";
            } else {
                loginMessage.className = "text-sm text-center text-green-600";
            }
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const email = document.getElementById("email").value.trim().toLowerCase();
                const password = document.getElementById("password").value;

                if (!isValidEmail(email)) {
                    throw new Error("Please enter a valid email address.");
                }

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message.toLowerCase().includes("email not confirmed")) {
                        throw new Error("Please confirm your email address before logging in.");
                    }

                    throw new Error("Invalid email or password.");
                }

                const profile = await getCurrentProfile();

                if (profile && profile.role === "admin") {
                    window.location.href = "upload.html";
                } else {
                    window.location.href = "index.html";
                }

            } catch (error) {
                console.error(error);
                showMessage(error.message || "Login failed.", true);
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
