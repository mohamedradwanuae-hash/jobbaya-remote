<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Jobbaya Remote</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-emerald-600">
                🏠 Jobbaya Remote
            </a>

            <div class="space-x-4 text-sm">
                <a href="index.html" class="hover:text-emerald-600">Jobs</a>
                <a href="login.html" class="hover:text-emerald-600">Login</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-sm border">
            <h1 class="text-3xl font-bold mb-6 text-center">
                Create Account
            </h1>

            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your name"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="e.g. 01012345678"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 6 characters"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Repeat password"
                        required
                        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                </div>

                <button
                    type="submit"
                    id="signup-button"
                    class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition"
                >
                    Sign Up
                </button>

                <p id="signup-message" class="text-sm text-center hidden"></p>
            </form>

            <p class="text-sm text-gray-500 text-center mt-6">
                Already have an account?

                <a href="login.html" class="text-emerald-600 font-semibold hover:underline">
                    Login
                </a>
            </p>
        </div>

    </main>

    <script src="config.js"></script>

    <script>
        const signupForm = document.getElementById("signup-form");
        const signupButton = document.getElementById("signup-button");
        const signupMessage = document.getElementById("signup-message");

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showMessage(message, isError = false) {
            signupMessage.textContent = message;
            signupMessage.classList.remove("hidden");

            if (isError) {
                signupMessage.className = "text-sm text-center text-red-500";
            } else {
                signupMessage.className = "text-sm text-center text-green-600";
            }
        }

        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            signupButton.disabled = true;
            signupButton.textContent = "Creating account...";

            try {
                const name = document.getElementById("name").value.trim();
                const phoneRaw = document.getElementById("phone").value;
                const email = document.getElementById("email").value.trim().toLowerCase();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm-password").value;

                const phone = normalizePhone(phoneRaw);

                if (!name) {
                    throw new Error("Please enter your name.");
                }

                if (!isValidPhone(phone)) {
                    throw new Error("Please enter a valid Egyptian phone number.");
                }

                if (!isValidEmail(email)) {
                    throw new Error("Please enter a valid email address.");
                }

                if (password.length < 6) {
                    throw new Error("Password must be at least 6 characters.");
                }

                if (password !== confirmPassword) {
                    throw new Error("Passwords do not match.");
                }

                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name,
                            phone: phone
                        }
                    }
                });

                if (error) {
                    if (
                        error.message.toLowerCase().includes("already")
                        || error.message.toLowerCase().includes("registered")
                    ) {
                        throw new Error("This email is already registered.");
                    }

                    throw new Error(error.message || "Signup failed.");
                }

                if (data.session) {
                    showMessage("Account created successfully. Redirecting...");

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 800);
                } else {
                    showMessage("Account created. Please check your email to confirm your address, then login.");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                }

            } catch (error) {
                console.error(error);
                showMessage(error.message || "Signup failed.", true);
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = "Sign Up";
            }
        });
    </script>

</body>
</html>
